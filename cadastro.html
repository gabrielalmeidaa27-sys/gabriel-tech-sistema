<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GabrielTech | Cadastro e Orçamento de Serviços</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: { 950: '#050505', 900: '#0a0a0a', 800: '#121212', 700: '#1a1a1a', 600: '#262626' },
                        brand: { cyan: '#00f2fe', blue: '#4facfe', green: '#10b981' }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Folha de Estilos Personalizada -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark-950 text-gray-100 antialiased">

    <!-- CABEÇALHO DA PÁGINA DE CADASTRO -->
    <header class="fixed top-0 left-0 w-full z-50 bg-dark-900/90 backdrop-blur-md border-b border-dark-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <!-- Logo voltando para a página principal -->
            <a href="index.html" class="flex items-center space-x-3 group">
                <div class="w-10 h-10 rounded-xl gradient-bg flex items-center justify-center text-dark-900 font-extrabold text-xl shadow-lg">
                    <i class="fa-solid fa-mobile-screen-button"></i>
                </div>
                <div class="flex flex-col">
                    <span class="text-2xl font-black tracking-wider text-white">GABRIEL<span class="gradient-text">TECH</span></span>
                    <span class="text-[10px] tracking-widest text-gray-400 uppercase -mt-1">Painel do Cliente</span>
                </div>
            </a>
            <!-- Botão Voltar -->
            <a href="index.html" class="px-4 py-2 rounded-xl bg-dark-800 hover:bg-dark-700 border border-dark-600 text-sm font-semibold transition-colors flex items-center space-x-2">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Voltar ao Início</span>
            </a>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL: FORMULÁRIO DE CADASTRO E ORÇAMENTO -->
    <main class="pt-32 pb-20 px-4 sm:px-6 lg:px-8">
        <div class="max-w-2xl mx-auto bg-dark-900 border border-dark-800 rounded-3xl p-8 sm:p-10 shadow-2xl">
            
            <div class="text-center space-y-2 mb-8">
                <span class="text-brand-cyan text-xs font-bold tracking-widest uppercase px-3 py-1 bg-dark-800 rounded-full border border-dark-700">Atendimento Personalizado</span>
                <h1 class="text-3xl font-extrabold text-white">Cadastro e Orçamento</h1>
                <p class="text-gray-400 text-sm">Preencha suas informações e os dados do aparelho para gerarmos sua solicitação de serviço.</p>
            </div>

            <!-- Formulário que envia os dados para o script PHP (processa.php) -->
            <form action="processa.php" method="POST" class="space-y-6">
                
                <!-- Dados Pessoais do Cliente -->
                <div class="space-y-4">
                    <h3 class="text-lg font-bold text-brand-cyan border-b border-dark-800 pb-2">1. Informações Pessoais</h3>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">Nome Completo</label>
                        <input type="text" name="nome" required placeholder="Digite seu nome completo" class="w-full bg-dark-950 border border-dark-700 rounded-xl px-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:border-brand-cyan transition-colors">
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1">Telefone / WhatsApp</label>
                            <input type="text" name="telefone" required placeholder="(00) 00000-0000" class="w-full bg-dark-950 border border-dark-700 rounded-xl px-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:border-brand-cyan transition-colors">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1">E-mail</label>
                            <input type="email5" name="email" placeholder="seu@email.com" class="w-full bg-dark-950 border border-dark-700 rounded-xl px-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:border-brand-cyan transition-colors">
                        </div>
                    </div>
                </div>

                <!-- Dados do Aparelho e Orçamento -->
                <div class="space-y-4 pt-2">
                    <h3 class="text-lg font-bold text-brand-cyan border-b border-dark-800 pb-2">2. Detalhes do Aparelho e Serviço</h3>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1">Marca do Aparelho</label>
                            <select name="marca" required class="w-full bg-dark-950 border border-dark-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-cyan transition-colors">
                                <option value="" disabled selected>Selecione a marca</option>
                                <option value="Apple">Apple (iPhone)</option>
                                <option value="Samsung">Samsung</option>
                                <option value="Xiaomi">Xiaomi</option>
                                <option value="Motorola">Motorola</option>
                                <option value="Outros">Outra</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1">Modelo Específico</label>
                            <input type="text" name="modelo" required placeholder="Ex: iPhone 13, Redmi Note 11" class="w-full bg-dark-950 border border-dark-700 rounded-xl px-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:border-brand-cyan transition-colors">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">Serviço Desejado / Orçamento</label>
                        <select name="servico" required class="w-full bg-dark-950 border border-dark-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-cyan transition-colors">
                            <option value="" disabled selected>Selecione o serviço necessário</option>
                            <option value="Troca de Tela">Troca de Tela / Display</option>
                            <option value="Troca de Bateria">Troca de Bateria</option>
                            <option value="Remocao Conta Google">Remoção de Conta Google (FRP)</option>
                            <option value="Reparo em Placa">Reparo em Placa Lógica</option>
                            <option value="Conector de Carga">Conector de Carga</option>
                            <option value="Desoxidacao">Desoxidação (Danos por Líquidos)</option>
                            <option value="Outros">Outro Problema</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">Descreva o Problema ou Detalhes</label>
                        <textarea name="observacoes" rows="4" placeholder="Conte mais detalhes sobre o defeito apresentado..." class="w-full bg-dark-950 border border-dark-700 rounded-xl px-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:border-brand-cyan transition-colors resize-none"></textarea>
                    </div>
                </div>

                <!-- Botão de Envio -->
                <div class="pt-4">
                    <button type="submit" id="btnWhatsApp" class="w-full py-4 rounded-xl bg-[#25D366] hover:bg-[#20ba5a] text-white font-extrabold text-base shadow-lg shadow-green-900/30 transition-all flex items-center justify-center space-x-2 cursor-pointer">
        <i class="fa-brands fa-whatsapp text-2xl"></i>
        <span>Enviar Orçamento pelo WhatsApp</span>
    </button>
                    </button>
                </div>

            </form>
        </div>
    </main>
<!-- SCRIPT DE ENVIO PARA O WHATSAPP -->
<script>
    document.querySelector('form').addEventListener('submit', function(e) {
        e.preventDefault(); // Impede o recarregamento da página
        
        // Captura os dados preenchidos no formulário
        const nome = document.querySelector('input[name="nome"]').value;
        const telefone = document.querySelector('input[name="telefone"]').value;
        const email = document.querySelector('input[name="email"]').value;
        const marca = document.querySelector('select[name="marca"]').value;
        const modelo = document.querySelector('input[name="modelo"]').value;
        const servico = document.querySelector('select[name="servico"]').value;
        const observacoes = document.querySelector('textarea[name="observacoes"]').value;

        // Formata a mensagem
        let mensagem = `*NOVO ORÇAMENTO - GABRIEL TECH*\n\n`;
        mensagem += `👤 *Cliente:* ${nome}\n`;
        mensagem += `📞 *Telefone:* ${telefone}\n`;
        if (email) mensagem += `📧 *E-mail:* ${email}\n`;
        mensagem += `\n📱 *Aparelho:* ${marca} - ${modelo}\n`;
        mensagem += `🛠️ *Serviço:* ${servico}\n`;
        if (observacoes) mensagem += `📝 *Observações:* ${observacoes}\n`;

        // Coloca o teu número com DDD (exemplo: 55919XXXXYYYY)
        const numeroWhatsapp = "5591999999999"; 

        // Abre o WhatsApp com a mensagem pré-formatada
        const url = `https://wa.me/${numeroWhatsapp}?text=${encodeURIComponent(mensagem)}`;
        window.open(url, '_blank');
    });
</script>

</body>
</html>
</body>
</html>
